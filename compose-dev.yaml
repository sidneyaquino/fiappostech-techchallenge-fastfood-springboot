services:
  # ====================================================================================================================
  # APP
  # ====================================================================================================================
  web:
    image: docker.io/bellsoft/liberica-native-image-kit-container:jdk-24-nik-24-musl
    # image: ghcr.io/graalvm/native-image-community:24-muslib
    container_name: fastfood
    working_dir: /app
    volumes:
      - $PWD:/app
      - ${HOME}/.m2/repository:/root/.m2/repository
    ports:
      - 5005:5005
      - 8080:8080
    environment:
      # APP_PROFILE: prod
      DB_HOST: ${DB_HOST:-sql}
      DB_NAME: ${DB_NAME:-fastfood}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
    entrypoint:
      [
        "sh", "-c",
        "./mvnw spring-boot:run", 
        "-Dmanven.test.skip=true", "-DskipTests", "-Djacoco.skip"
      ]
    depends_on:
      - sql
    networks:
      - network
    restart: always

  # ====================================================================================================================
  # POSTGRES SERVER
  # ====================================================================================================================
  sql:
    image: docker.io/chainguard/postgres:latest-dev
    container_name: postgres
    environment:
      POSTGRES_DB: $(DB_NAME:-fastfood}
      POSTGRES_USER: $(DB_USER:-postgres}
      POSTGRES_PASSWORD: $(DB_PASS:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: GMT
    ports:
      - 5432:5432
    volumes:
      - ./.data/postgresql/data:/var/lib/postgresql/data
    networks:
      - network
    restart: always

# ======================================================================================================================
# NET
# ======================================================================================================================
networks:
  network:
    driver: bridge