services:
  # ====================================================================================================================
  # APP
  # ====================================================================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/sidneyaquino/fiappostech-fastfood:0.4.2
    container_name: fastfood
    ports:
      - ${PORT:-8080}:${PORT:-8080}
    environment:
      # JAVA_OPTS: "-Xmx300m -Xss512k -XX:CICompilerCount=2"
      APP_PROFILE: prod
      PORT: ${PORT:-8080}
      DB_HOST: ${DB_HOST:-sql}
      DB_NAME: ${DB_NAME:-fastfood}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
    depends_on:
      - sql
    networks:
      - network
    restart: always

  # ====================================================================================================================
  # POSTGRES SERVER
  # ====================================================================================================================
  sql:
    image: docker.io/chainguard/postgres:latest-dev
    container_name: postgres
    environment:
      POSTGRES_DB: $(DB_NAME:-fastfood}
      POSTGRES_USER: $(DB_USER:-postgres}
      POSTGRES_PASSWORD: $(DB_PASS:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: GMT
    ports:
      - 5432:5432
    volumes:
      - ./.data/postgresql/data:/var/lib/postgresql/data
    networks:
      - network
    restart: always

# ======================================================================================================================
# NET
# ======================================================================================================================
networks:
  network:
    driver: bridge